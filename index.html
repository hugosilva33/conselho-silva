<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Conselho Silva de Performance</title>
<meta name="theme-color" content="#14120F" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14120F; font-family: 'IBM Plex Sans', sans-serif; color: #EDE7DD; }
  input::placeholder { color: #8C8478; opacity: 0.6; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #root { min-height: 100vh; }
  button { cursor: pointer; }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useMemo, useCallback, createElement: h } = React;

const COLORS = {
  bg: "#14120F",
  surface: "#1E1B17",
  surfaceAlt: "#262220",
  border: "#3A342D",
  text: "#EDE7DD",
  textMuted: "#8C8478",
  accent: "#C9A227",
  good: "#6B8F71",
  bad: "#B3452E",
  neutral: "#8C8478",
};

const DAYS = [
  { name: "Push A", label: "Empurrar", exercises: [
    { id: "supino_maq", name: "Supino máquina", sets: 3, repRange: "8-12" },
    { id: "desenv_maq", name: "Desenvolvimento máquina", sets: 3, repRange: "8-12" },
    { id: "elev_lateral", name: "Elevação lateral", sets: 3, repRange: "12-15" },
    { id: "triceps_corda", name: "Tríceps corda", sets: 3, repRange: "10-12" },
  ]},
  { name: "Pull A", label: "Puxar", exercises: [
    { id: "puxada_frente", name: "Puxada frente (pulley)", sets: 3, repRange: "8-12" },
    { id: "remada_maq", name: "Remada máquina", sets: 3, repRange: "8-12" },
    { id: "face_pull", name: "Face pull", sets: 3, repRange: "12-15" },
    { id: "rosca_direta", name: "Rosca direta", sets: 3, repRange: "10-12" },
  ]},
  { name: "Legs A", label: "Pernas · quadríceps", exercises: [
    { id: "leg_press", name: "Leg press", sets: 3, repRange: "10-12" },
    { id: "cad_extensora", name: "Cadeira extensora", sets: 3, repRange: "12-15" },
    { id: "cad_flexora_a", name: "Cadeira flexora", sets: 3, repRange: "10-12" },
    { id: "panturrilha", name: "Panturrilha", sets: 3, repRange: "12-15" },
  ]},
  { name: "Push B", label: "Empurrar", exercises: [
    { id: "supino_maq", name: "Supino máquina", sets: 3, repRange: "8-12" },
    { id: "desenv_maq", name: "Desenvolvimento máquina", sets: 3, repRange: "8-12" },
    { id: "elev_lateral", name: "Elevação lateral", sets: 3, repRange: "12-15" },
    { id: "triceps_corda", name: "Tríceps corda", sets: 3, repRange: "10-12" },
  ]},
  { name: "Pull B", label: "Puxar", exercises: [
    { id: "puxada_frente", name: "Puxada frente (pulley)", sets: 3, repRange: "8-12" },
    { id: "remada_maq", name: "Remada máquina", sets: 3, repRange: "8-12" },
    { id: "face_pull", name: "Face pull", sets: 3, repRange: "12-15" },
    { id: "rosca_direta", name: "Rosca direta", sets: 3, repRange: "10-12" },
  ]},
  { name: "Legs B", label: "Pernas · posterior/glúteo", exercises: [
    { id: "hip_thrust", name: "Hip thrust", sets: 3, repRange: "10-12" },
    { id: "stiff", name: "Stiff (halteres)", sets: 3, repRange: "10-12" },
    { id: "cad_flexora_b", name: "Cadeira flexora", sets: 3, repRange: "10-12" },
    { id: "abducao", name: "Abdução de quadril", sets: 3, repRange: "12-15" },
  ]},
];

const STORAGE_KEY = "conselho-silva-data";
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => { const [y, m, d] = iso.split("-"); return `${d}/${m}`; };
function emptyData() { return { sessions: {}, bodyweight: [] }; }

function useAppData() {
  const [data, setData] = useState(null);
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      setData(raw ? JSON.parse(raw) : emptyData());
    } catch {
      setData(emptyData());
    }
  }, []);

  const persist = useCallback((next) => {
    setData(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch {}
  }, []);

  return { data, persist };
}

function lastDayIndex(sessions) {
  const dates = Object.keys(sessions).sort();
  if (dates.length === 0) return -1;
  return sessions[dates[dates.length - 1]].dayIndex;
}

function findPreviousLog(sessions, currentDate, exerciseId) {
  const dates = Object.keys(sessions).filter((d) => d < currentDate).sort().reverse();
  for (const d of dates) {
    const ex = sessions[d].exercises.find((e) => e.id === exerciseId);
    if (ex && ex.sets.some((s) => s.weight)) return { date: d, exercise: ex };
  }
  return null;
}

function computeStatus(prevSets, currSets) {
  const prevWeight = Math.max(...prevSets.map((s) => Number(s.weight) || 0));
  const currWeight = Math.max(...currSets.map((s) => Number(s.weight) || 0));
  const prevReps = prevSets.reduce((a, s) => a + (Number(s.reps) || 0), 0);
  const currReps = currSets.reduce((a, s) => a + (Number(s.reps) || 0), 0);
  if (currWeight > prevWeight) return "nova_carga";
  if (currWeight < prevWeight) return "carga_reduzida";
  if (currReps > prevReps) return "progrediu";
  if (currReps === prevReps) return "manteve";
  return "regrediu";
}

const STATUS_META = {
  progrediu: { label: "Progrediu", color: COLORS.good },
  manteve: { label: "Manteve", color: COLORS.neutral },
  regrediu: { label: "Regrediu", color: COLORS.bad },
  nova_carga: { label: "Nova carga", color: COLORS.accent },
  carga_reduzida: { label: "Carga reduzida", color: COLORS.bad },
};

function Stamp({ statusKey }) {
  const meta = STATUS_META[statusKey];
  if (!meta) return null;
  return h("div", {
    style: {
      display: "inline-block", padding: "4px 8px", border: `1px solid ${meta.color}`, borderRadius: "4px",
      color: meta.color, transform: "rotate(-2deg)", fontFamily: "'Oswald', sans-serif", fontSize: "11px",
      letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 600,
    }
  }, meta.label);
}

function RirPicker({ value, onChange }) {
  const options = ["0", "1", "2", "3+"];
  return h("div", { style: { display: "flex", gap: "4px" } },
    options.map((o) => h("button", {
      key: o,
      type: "button",
      onClick: () => onChange(o),
      style: {
        borderRadius: "4px", padding: "4px 8px", fontSize: "12px", fontFamily: "'IBM Plex Mono', monospace",
        background: value === o ? COLORS.accent : "transparent", color: value === o ? COLORS.bg : COLORS.textMuted,
        border: `1px solid ${value === o ? COLORS.accent : COLORS.border}`,
      }
    }, o))
  );
}

function ExerciseCard({ exercise, prevLog, setValue, current, savedStatus }) {
  return h("div", {
    style: { borderRadius: "8px", padding: "12px", marginBottom: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` }
  }, [
    h("div", {
      key: "head",
      style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "4px" }
    }, [
      h("div", { key: "title-wrap" }, [
        h("div", { key: "name", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "16px", letterSpacing: "0.02em" } }, exercise.name.toUpperCase()),
        h("div", { key: "range", style: { color: COLORS.textMuted, fontSize: "11px" } }, `Faixa alvo: ${exercise.repRange} reps`)
      ]),
      savedStatus ? h(Stamp, { key: "stamp", statusKey: savedStatus }) : null
    ]),
    prevLog ? h("div", {
      key: "prev",
      style: { marginBottom: "8px", fontSize: "12px", color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace" }
    }, `Última vez (${fmtDate(prevLog.date)}): ${prevLog.exercise.sets.map((s) => `${s.weight || 0}kg×${s.reps || 0}`).join(" · ")}`)
    : h("div", {
      key: "first",
      style: { marginBottom: "8px", fontSize: "12px", color: COLORS.textMuted }
    }, "Primeira vez registrando este exercício."),
    h("div", { key: "sets", style: { display: "grid", gap: "8px" } },
      current.map((set, i) => h("div", {
        key: i,
        style: { display: "flex", alignItems: "center", gap: "8px" }
      }, [
        h("span", { key: "num", style: { color: COLORS.textMuted, fontSize: "11px", width: "14px" } }, i + 1),
        h("input", {
          key: "w",
          type: "number",
          inputMode: "decimal",
          placeholder: "kg",
          value: set.weight,
          onChange: (e) => setValue(i, "weight", e.target.value),
          style: { borderRadius: "4px", padding: "4px 8px", width: "64px", fontSize: "14px", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, fontFamily: "'IBM Plex Mono', monospace" }
        }),
        h("input", {
          key: "r",
          type: "number",
          inputMode: "numeric",
          placeholder: "reps",
          value: set.reps,
          onChange: (e) => setValue(i, "reps", e.target.value),
          style: { borderRadius: "4px", padding: "4px 8px", width: "64px", fontSize: "14px", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, fontFamily: "'IBM Plex Mono', monospace" }
        }),
        h(RirPicker, { key: "rir", value: set.rir, onChange: (v) => setValue(i, "rir", v) })
      ]))
    )
  ]);
}

function TreinoTab({ data, persist }) {
  const suggestedIndex = useMemo(() => {
    const li = lastDayIndex(data.sessions);
    return li === -1 ? 0 : (li + 1) % DAYS.length;
  }, [data.sessions]);

  const [dayIndex, setDayIndex] = useState(suggestedIndex);
  const day = DAYS[dayIndex];
  const date = todayISO();

  const [draft, setDraft] = useState(() => day.exercises.map((ex) => ({
    id: ex.id, sets: Array.from({ length: ex.sets }, () => ({ weight: "", reps: "", rir: "2" })),
  })));
  const [savedStatuses, setSavedStatuses] = useState({});

  useEffect(() => {
    setDraft(day.exercises.map((ex) => ({
      id: ex.id, sets: Array.from({ length: ex.sets }, () => ({ weight: "", reps: "", rir: "2" })),
    })));
    setSavedStatuses({});
  }, [dayIndex]);

  const setValue = (exIdx, setIdx, field, value) => {
    setDraft((prev) => {
      const next = [...prev];
      next[exIdx] = { ...next[exIdx], sets: [...next[exIdx].sets] };
      next[exIdx].sets[setIdx] = { ...next[exIdx].sets[setIdx], [field]: value };
      return next;
    });
  };

  const handleSave = () => {
    const exercisesToSave = day.exercises.map((ex, i) => ({
      id: ex.id, name: ex.name, sets: draft[i].sets.filter((s) => s.weight || s.reps),
    })).filter((ex) => ex.sets.length > 0);

    if (exercisesToSave.length === 0) return;

    const newStatuses = {};
    const exercisesWithStatus = exercisesToSave.map((ex) => {
      const prev = findPreviousLog(data.sessions, date, ex.id);
      const st = prev ? computeStatus(prev.exercise.sets, ex.sets) : null;
      if (st) newStatuses[ex.id] = st;
      return { ...ex, status: st };
    });
    setSavedStatuses(newStatuses);

    const nextSessions = { ...data.sessions, [date]: { dayIndex, dayName: day.name, exercises: exercisesWithStatus } };
    persist({ ...data, sessions: nextSessions });
  };

  return h("div", { style: { padding: "16px", paddingBottom: "96px" } }, [
    h("div", { key: "meta", style: { marginBottom: "16px" } }, [
      h("div", { key: "d", style: { color: COLORS.textMuted, fontSize: "12px", fontFamily: "'IBM Plex Mono', monospace" } }, date.split("-").reverse().join("/")),
      h("div", { key: "n", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "32px", letterSpacing: "0.01em", lineHeight: 1 } }, day.name.toUpperCase()),
      h("div", { key: "l", style: { color: COLORS.accent, fontSize: "13px" } }, day.label)
    ]),
    h("div", { key: "picker", style: { display: "flex", gap: "8px", marginBottom: "16px", overflowX: "auto" } },
      DAYS.map((d, i) => h("button", {
        key: i,
        type: "button",
        onClick: () => setDayIndex(i),
        style: {
          borderRadius: "4px", padding: "4px 12px", fontSize: "12px", flexShrink: 0,
          fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em",
          background: i === dayIndex ? COLORS.accent : "transparent",
          color: i === dayIndex ? COLORS.bg : COLORS.textMuted,
          border: `1px solid ${i === dayIndex ? COLORS.accent : COLORS.border}`,
        }
      }, d.name.toUpperCase()))
    ),
    day.exercises.map((ex, i) => h(ExerciseCard, {
      key: ex.id + i,
      exercise: ex,
      prevLog: findPreviousLog(data.sessions, date, ex.id),
      current: draft[i].sets,
      savedStatus: savedStatuses[ex.id],
      setValue: (setIdx, field, value) => setValue(i, setIdx, field, value)
    })),
    h("button", {
      key: "save",
      type: "button",
      onClick: handleSave,
      style: {
        width: "100%", borderRadius: "8px", padding: "12px", marginTop: "8px",
        background: COLORS.accent, color: COLORS.bg, fontFamily: "'Oswald', sans-serif",
        fontSize: "15px", letterSpacing: "0.08em", fontWeight: 600, border: "none",
      }
    }, "SALVAR TREINO DO DIA")
  ]);
}

function Sparkline({ points, color }) {
  if (points.length < 2) return null;
  const w = 320, h = 140, pad = 12;
  const values = points.map((p) => p.weight);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - pad * 2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.weight - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });

  return h("svg", { viewBox: `0 0 ${w} ${h}`, style: { width: "100%", height: "160px" } }, [
    h("polyline", { key: "line", points: coords.join(" "), fill: "none", stroke: color, strokeWidth: "2" }),
    ...coords.map((c, i) => {
      const [x, y] = c.split(",");
      return h("circle", { key: i, cx: x, cy: y, r: "2.5", fill: color });
    })
  ]);
}

function ProgressoTab({ data, persist }) {
  const [weight, setWeight] = useState("");
  const sorted = useMemo(() => [...data.bodyweight].sort((a, b) => (a.date < b.date ? -1 : 1)), [data.bodyweight]);

  const addWeight = () => {
    if (!weight) return;
    const date = todayISO();
    const filtered = data.bodyweight.filter((e) => e.date !== date);
    const next = [...filtered, { date, weight: Number(weight) }];
    persist({ ...data, bodyweight: next });
    setWeight("");
  };

  const latest = sorted[sorted.length - 1];
  const startWeight = sorted[0];

  return h("div", { style: { padding: "16px", paddingBottom: "96px" } }, [
    h("div", { key: "title", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "28px", marginBottom: "16px" } }, "PROGRESSO"),
    h("div", {
      key: "input-row",
      style: { borderRadius: "8px", padding: "12px", marginBottom: "16px", display: "flex", alignItems: "center", gap: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` }
    }, [
      h("input", {
        key: "in",
        type: "number",
        inputMode: "decimal",
        placeholder: "peso hoje (kg)",
        value: weight,
        onChange: (e) => setWeight(e.target.value),
        style: { borderRadius: "4px", padding: "8px 12px", flex: 1, fontSize: "14px", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, fontFamily: "'IBM Plex Mono', monospace" }
      }),
      h("button", {
        key: "btn",
        type: "button",
        onClick: addWeight,
        style: { borderRadius: "4px", padding: "8px 16px", fontSize: "14px", background: COLORS.accent, color: COLORS.bg, fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em", border: "none" }
      }, "REGISTRAR")
    ]),
    latest && startWeight ? h("div", {
      key: "stats",
      style: { display: "flex", gap: "16px", marginBottom: "16px" }
    }, [
      h("div", { key: "cur" }, [
        h("div", { style: { color: COLORS.textMuted, fontSize: "11px" } }, "ATUAL"),
        h("div", { style: { fontFamily: "'IBM Plex Mono', monospace", color: COLORS.text, fontSize: "22px" } }, `${latest.weight}kg`)
      ]),
      h("div", { key: "var" }, [
        h("div", { style: { color: COLORS.textMuted, fontSize: "11px" } }, "VARIAÇÃO NO PERÍODO"),
        h("div", { style: { fontFamily: "'IBM Plex Mono', monospace", color: latest.weight <= startWeight.weight ? COLORS.good : COLORS.bad, fontSize: "22px" } }, `${(latest.weight - startWeight.weight).toFixed(1)}kg`)
      ])
    ]) : null,
    sorted.length > 1 ? h("div", {
      key: "graph",
      style: { background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: "8px", padding: "8px" }
    }, h(Sparkline, { points: sorted, color: COLORS.accent })) : h("div", {
      key: "empty",
      style: { color: COLORS.textMuted, fontSize: "13px" }
    }, "Registre seu peso por alguns dias para ver a tendência aqui. Uma medição isolada não diz nada — o que importa é a curva.")
  ]);
}

function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

function buildWeeklyReview(data) {
  const since = daysAgoISO(6);
  const weekDates = Object.keys(data.sessions).filter((d) => d >= since).sort();
  const sessions = weekDates.map((d) => data.sessions[d]);

  const exerciseStatus = {};
  sessions.forEach((s) => s.exercises.forEach((ex) => { if (ex.status) exerciseStatus[ex.name] = ex.status; }));

  const progressed = Object.entries(exerciseStatus).filter(([, s]) => s === "progrediu" || s === "nova_carga");
  const maintained = Object.entries(exerciseStatus).filter(([, s]) => s === "manteve");
  const regressed = Object.entries(exerciseStatus).filter(([, s]) => s === "regrediu" || s === "carga_reduzida");

  const weekWeights = data.bodyweight.filter((e) => e.date >= since).sort((a, b) => (a.date < b.date ? -1 : 1));
  const prevWeekWeights = data.bodyweight.filter((e) => e.date >= daysAgoISO(13) && e.date < since).sort((a, b) => (a.date < b.date ? -1 : 1));
  const avg = (arr) => (arr.length ? arr.reduce((a, e) => a + e.weight, 0) / arr.length : null);
  const weekAvg = avg(weekWeights), prevAvg = avg(prevWeekWeights);
  const weightDelta = weekAvg !== null && prevAvg !== null ? weekAvg - prevAvg : null;

  let mainWin, mainIssue;
  if (progressed.length > 0) mainWin = `Progressão em ${progressed.map(([n]) => n).join(", ")}.`;
  else if (sessions.length > 0) mainWin = "Consistência: treinos concluídos dentro da semana.";
  else mainWin = "Nenhum treino registrado ainda essa semana.";

  if (regressed.length > 0) mainIssue = `Queda de desempenho em ${regressed.map(([n]) => n).join(", ")}.`;
  else if (maintained.length >= 2) mainIssue = `Estagnação em ${maintained.map(([n]) => n).join(", ")}.`;
  else if (sessions.length < 4) mainIssue = `Frequência baixa: apenas ${sessions.length} de 6 treinos concluídos.`;
  else mainIssue = "Nenhum problema relevante identificado.";

  const actions = [];
  if (regressed.length > 0) actions.push(`Investigar recuperação (sono, volume, técnica) em: ${regressed.map(([n]) => n).join(", ")}.`);
  if (maintained.length > 0) actions.push(`Tentar superar o desempenho anterior ou revisar execução em: ${maintained.map(([n]) => n).join(", ")}.`);
  if (sessions.length < 4) actions.push(`Retomar frequência: só ${sessions.length} de 6 treinos essa semana. Priorizar consistência antes de intensidade.`);
  if (weightDelta !== null) {
    if (Math.abs(weightDelta) < 0.15) actions.push("Peso estagnado entre as semanas. Se o objetivo pede mudança, ajustar calorias em pequena escala (100-150 kcal) — não decidir com base em uma semana isolada.");
  } else {
    actions.push("Registrar peso corporal com mais frequência para conseguir enxergar tendência real.");
  }
  if (progressed.length > 0 && regressed.length === 0) actions.push("O que está funcionando, continuar sem mudar por vaidade.");

  return { since, sessionsCount: sessions.length, progressed, maintained, regressed, weekAvg, weightDelta, mainWin, mainIssue, actions: actions.slice(0, 5) };
}

function ReviewTab({ data }) {
  const [review, setReview] = useState(null);
  return h("div", { style: { padding: "16px", paddingBottom: "96px" } }, [
    h("div", { key: "title", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "28px", marginBottom: "4px" } }, "REVISÃO SEMANAL"),
    h("div", { key: "sub", style: { color: COLORS.textMuted, fontSize: "12px", marginBottom: "16px" } }, "Últimos 7 dias, comparado à semana anterior."),
    h("button", {
      key: "btn",
      type: "button",
      onClick: () => setReview(buildWeeklyReview(data)),
      style: {
        width: "100%", borderRadius: "8px", padding: "12px", marginBottom: "16px",
        background: COLORS.accent, color: COLORS.bg, fontFamily: "'Oswald', sans-serif",
        fontSize: "14px", letterSpacing: "0.06em", fontWeight: 600, border: "none",
      }
    }, "GERAR REVISÃO"),
    review ? h("div", { key: "content", style: { display: "grid", gap: "12px" } }, [
      h("div", { key: "treino-card", style: { borderRadius: "8px", padding: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` } }, [
        h("div", { style: { fontFamily: "'Oswald', sans-serif", color: COLORS.accent, fontSize: "13px", letterSpacing: "0.06em", marginBottom: "6px" } }, "TREINO"),
        h("div", { style: { color: COLORS.text, fontSize: "13px", fontFamily: "'IBM Plex Mono', monospace" } }, `${review.sessionsCount} de 6 treinos concluídos`),
        review.progressed.length > 0 ? h("div", { style: { color: COLORS.good, fontSize: "12px", marginTop: "4px" } }, `Progrediu: ${review.progressed.map(([n]) => n).join(", ")}`) : null,
        review.maintained.length > 0 ? h("div", { style: { color: COLORS.neutral, fontSize: "12px", marginTop: "4px" } }, `Manteve: ${review.maintained.map(([n]) => n).join(", ")}`) : null,
        review.regressed.length > 0 ? h("div", { style: { color: COLORS.bad, fontSize: "12px", marginTop: "4px" } }, `Regrediu: ${review.regressed.map(([n]) => n).join(", ")}`) : null,
      ]),
      h("div", { key: "comp-card", style: { borderRadius: "8px", padding: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` } }, [
        h("div", { style: { fontFamily: "'Oswald', sans-serif", color: COLORS.accent, fontSize: "13px", letterSpacing: "0.06em", marginBottom: "6px" } }, "COMPOSIÇÃO CORPORAL"),
        h("div", { style: { color: COLORS.text, fontSize: "13px", fontFamily: "'IBM Plex Mono', monospace" } }, review.weekAvg !== null ? `Média da semana: ${review.weekAvg.toFixed(1)}kg` : "Sem registros de peso nessa semana"),
        review.weightDelta !== null ? h("div", { style: { color: review.weightDelta <= 0 ? COLORS.good : COLORS.bad, fontSize: "12px", marginTop: "4px" } }, `Variação vs. semana anterior: ${review.weightDelta > 0 ? "+" : ""}${review.weightDelta.toFixed(1)}kg`) : null
      ]),
      h("div", { key: "diag-card", style: { borderRadius: "8px", padding: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` } }, [
        h("div", { style: { fontFamily: "'Oswald', sans-serif", color: COLORS.accent, fontSize: "13px", letterSpacing: "0.06em", marginBottom: "6px" } }, "DIAGNÓSTICO"),
        h("div", { style: { color: COLORS.text, fontSize: "13px", marginBottom: "4px" } }, [h("span", { key: "w-tag", style: { color: COLORS.good } }, "Avanço: "), review.mainWin]),
        h("div", { style: { color: COLORS.text, fontSize: "13px" } }, [h("span", { key: "i-tag", style: { color: COLORS.bad } }, "Problema: "), review.mainIssue])
      ]),
      h("div", { key: "act-card", style: { borderRadius: "8px", padding: "12px", background: COLORS.surface, border: `1px solid ${COLORS.border}` } }, [
        h("div", { style: { fontFamily: "'Oswald', sans-serif", color: COLORS.accent, fontSize: "13px", letterSpacing: "0.06em", marginBottom: "6px" } }, "PRÓXIMA SEMANA"),
        h("ul", { style: { color: COLORS.text, fontSize: "13px", paddingLeft: "16px", margin: 0 } },
          review.actions.map((a, i) => h("li", { key: i, style: { marginBottom: "6px" } }, a))
        )
      ])
    ]) : null
  ]);
}

function HistoricoTab({ data }) {
  const dates = Object.keys(data.sessions).sort().reverse();
  const [expanded, setExpanded] = useState(null);
  return h("div", { style: { padding: "16px", paddingBottom: "96px" } }, [
    h("div", { key: "title", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "28px", marginBottom: "16px" } }, "HISTÓRICO"),
    dates.length === 0 ? h("div", { key: "empty", style: { color: COLORS.textMuted, fontSize: "13px" } }, "Nenhum treino registrado ainda.") : null,
    ...dates.map((d) => {
      const s = data.sessions[d];
      const isOpen = expanded === d;
      return h("div", {
        key: d,
        style: { borderRadius: "8px", marginBottom: "8px", overflow: "hidden", background: COLORS.surface, border: `1px solid ${COLORS.border}` }
      }, [
        h("button", {
          key: "btn",
          type: "button",
          onClick: () => setExpanded(isOpen ? null : d),
          style: { width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px", background: "transparent", border: "none" }
        }, [
          h("div", { key: "info", style: { textAlign: "left" } }, [
            h("div", { key: "name", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.text, fontSize: "15px" } }, s.dayName.toUpperCase()),
            h("div", { key: "date", style: { color: COLORS.textMuted, fontSize: "11px" } }, `${fmtDate(d)} · ${s.exercises.length} exercícios`)
          ]),
          h("span", { key: "toggle", style: { color: COLORS.textMuted } }, isOpen ? "−" : "+")
        ]),
        isOpen ? h("div", {
          key: "content",
          style: { padding: "0 12px 12px" }
        }, s.exercises.map((ex) => h("div", {
          key: ex.id,
          style: { marginBottom: "8px" }
        }, [
          h("div", { key: "name", style: { color: COLORS.text, fontSize: "13px" } }, ex.name),
          h("div", { key: "sets", style: { color: COLORS.textMuted, fontSize: "12px", fontFamily: "'IBM Plex Mono', monospace" } },
            ex.sets.map((set) => `${set.weight || 0}kg×${set.reps || 0} (RIR ${set.rir})`).join(" · ")
          )
        ]))) : null
      ]);
    })
  ]);
}

function ConselhoSilva() {
  const { data, persist } = useAppData();
  const [tab, setTab] = useState("treino");

  if (!data) {
    return h("div", {
      style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg, color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace" }
    }, "carregando...");
  }

  const TABS = [
    { id: "treino", label: "Treino" },
    { id: "progresso", label: "Progresso" },
    { id: "revisao", label: "Revisão" },
    { id: "historico", label: "Histórico" },
  ];

  return h("div", { style: { minHeight: "100vh", background: COLORS.bg } }, [
    h("div", {
      key: "top-bar",
      style: { padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${COLORS.border}` }
    }, [
      h("div", { key: "brand", style: { fontFamily: "'Oswald', sans-serif", color: COLORS.accent, fontSize: "14px", letterSpacing: "0.1em" } }, "CONSELHO SILVA"),
      h("div", { key: "sub", style: { color: COLORS.textMuted, fontSize: "11px", fontFamily: "'IBM Plex Mono', monospace" } }, "DE PERFORMANCE")
    ]),
    tab === "treino" ? h(TreinoTab, { key: "t-treino", data, persist }) : null,
    tab === "progresso" ? h(ProgressoTab, { key: "t-progresso", data, persist }) : null,
    tab === "revisao" ? h(ReviewTab, { key: "t-revisao", data }) : null,
    tab === "historico" ? h(HistoricoTab, { key: "t-historico", data }) : null,
    h("div", {
      key: "nav",
      style: { position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", background: COLORS.surface, borderTop: `1px solid ${COLORS.border}` }
    }, TABS.map((t) => h("button", {
      key: t.id,
      type: "button",
      onClick: () => setTab(t.id),
      style: {
        flex: 1, padding: "12px 0", textAlign: "center", background: "transparent",
        fontFamily: "'Oswald', sans-serif", fontSize: "12px", letterSpacing: "0.08em",
        color: tab === t.id ? COLORS.accent : COLORS.textMuted,
        border: "none", borderTop: tab === t.id ? `2px solid ${COLORS.accent}` : "2px solid transparent",
      }
    }, t.label.toUpperCase())))
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(ConselhoSilva));
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then((reg) => console.log("Service Worker ativo no escopo:", reg.scope))
        .catch((err) => console.error("Falha ao registrar Service Worker:", err));
    });
  }
</script>
</body>
</html>
